services:
  avr:
    image: avr_build:0.0.2
    user: ${USERID}:${GROUPID}
    container_name: avr
    volumes:
      - ${PWD}:/usr/app/
    # Pour bash
    stdin_open: true
    tty: true

  build:
    extends: avr
    container_name: avr_build
    command:
      - /bin/sh
      - -c
      - |
        make all

  clean:
    extends: avr
    container_name: avr_clean
    command:
      - /bin/sh
      - -c
      - | 
        make clean

  cleanall:
    extends: avr
    container_name: avr_cleanall
    command:
      - /bin/sh
      - -c
      - | 
        make distclean

  custom:
    extends: avr
    container_name: avr_custom
    command:
      - /bin/sh
      - -c
      - | 
        make ${_CMD}

  install:
    extends: avr
    container_name: avr_install
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    command:
      - /bin/sh
      - -c
      - |
        make install
